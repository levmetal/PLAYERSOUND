<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PlayerSound app icon: a phosphor cassette on the CRT black tint. -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#050B05" />
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)"><g id="glyph" fill="none" stroke="#00FF66" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <!-- shell -->
    <rect x="60" y="120" width="392" height="272" rx="28" />
    <!-- label window -->
    <rect x="116" y="172" width="280" height="112" rx="14" />
    <!-- reels -->
    <circle cx="190" cy="228" r="30" />
    <circle cx="322" cy="228" r="30" />
    <circle cx="190" cy="228" r="6" fill="#00FF66" />
    <circle cx="322" cy="228" r="6" fill="#00FF66" />
    <!-- tape between the reels -->
    <line x1="232" y1="252" x2="280" y2="252" />
    <!-- bottom bridge -->
    <path d="M150 392 L176 330 H336 L362 392" />
  </g>
  </g>
</svg>
